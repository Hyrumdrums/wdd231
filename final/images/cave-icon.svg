<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rock shading -->
    <radialGradient id="rockGrad2" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7c776f"/>
      <stop offset="70%" stop-color="#4a4641"/>
      <stop offset="100%" stop-color="#2b2926"/>
    </radialGradient>

    <!-- Cave depth -->
    <radialGradient id="caveDepth2" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>

  <!-- Outer cave rock -->
  <path d="
    M10,56
    C14,28 30,14 48,14
    C66,14 82,28 86,56
    C78,70 66,80 48,84
    C30,80 18,70 10,56 Z"
    fill="url(#rockGrad2)"/>

  <!-- Inner cave wall -->
  <path d="
    M20,56
    C24,36 34,26 48,26
    C62,26 72,36 76,56
    C68,64 58,70 48,72
    C38,70 28,64 20,56 Z"
    fill="#3a3733"/>

  <!-- Cave opening -->
  <ellipse cx="48" cy="56" rx="14" ry="11" fill="url(#caveDepth2)"/>
</svg>